name: FreeBSD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "develop", "master" ]
  schedule:
    - cron: "00 21 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  general:
    strategy:
      matrix:
        # https://github.com/marketplace/actions/freebsd-vm
        release: [ "15.0", "14.2" ]
        arch: [ aarch64, amd64 ]
        build-tool: [ cmake, autotools ]
        compiler: [ { cpp: clang++, c: clang } ] # , {cpp: g++, c: gcc}
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
        exclude:
          # Do not use mismatching runner and vm arch
          - runner: ubuntu-24.04
            arch: aarch64
          - runner: ubuntu-24.04-arm
            arch: amd64
          # TODO: Though the arch of the runner and the vm is matching, it is extremly slow on aarch64, even if the runner is a matching aarch64
          #       Turn it off for now. Check if it is a runner or a vm issue.
          - runner: ubuntu-24.04-arm
            arch: aarch64
      fail-fast: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout syslog-ng source
        uses: actions/checkout@v4

      - name: Set ENV variables
        env:
          CC: ${{ matrix.compiler.c }}
          CXX: ${{ matrix.compiler.cpp }}
          THREADS: 4

        run: |
          . .github/workflows/gh-tools.sh

          #THREADS=$(sysctl -n hw.ncpu) # TODO: Check how to get it on the FreeBSD VM
          BSDPORTS_PREFIX=/usr/local
          SYSLOG_NG_INSTALL_DIR="${HOME}/install/syslog-ng"
          WARNING_FLAGS="-DNO_PTHREAD_SELF_USAGE_WARNING=1 -Wno-unused-command-line-argument"
          # All pkgconfig isses are fixed now, we do not have to use the BSDPORTS_PREFIX provided pats to point to the correct include path, but keep it here for reference
          #CFLAGS="-I${BSDPORTS_PREFIX}/include/ ${WARNING_FLAGS}"
          CFLAGS="${WARNING_FLAGS}"
          CXXFLAGS="${CFLAGS}"
          # All pkgconfig isses are fixed now, we do not have to use the LDFLAGS to point to the correct library path, but keep it here for reference
          #LDFLAGS="-L${BSDPORTS_PREFIX}/lib"
          # FIXME: The autotools used libtool will invoke clang with -Werror even for linking, which causes
          #        the build to fail when unsupported options passed to the linker (with unused command line arguments, which normally just warnings)
          #        so, for now not providing --enable-werror for autotools builds
          CONFIGURE_FLAGS="
            --enable-colored-log
            `[ $CC = clang ] && echo '--enable-force-gnu99' || true`
            --enable-extra-warnings
            --enable-debug
            --disable-dependency-tracking
            --prefix=${SYSLOG_NG_INSTALL_DIR}
            --enable-tests
            --enable-stackdump
            --enable-jemalloc
            --with-python=3
            --with-ivykis=internal
            --with-systemd-journal=no
            --enable-slog
            --disable-java
            --disable-java-modules
            --disable-mongodb
          "
          CMAKE_CONFIGURE_FLAGS="
            `[ $CC = clang ] && echo '-DENABLE_FORCE_GNU99=ON' || true`
            -DENABLE_EXTRA_WARNINGS=ON
            -DENABLE_WERROR=ON
            -DCMAKE_BUILD_TYPE=Debug
            -DSUMMARY_LEVEL=1
            -DCMAKE_INSTALL_PREFIX=${SYSLOG_NG_INSTALL_DIR}
            -DENABLE_TESTING=ON
            -DENABLE_STACKDUMP=ON
            -DENABLE_JEMALLOC=ON
            -DPYTHON_VERSION=3
            -DIVYKIS_SOURCE=internal
            -DENABLE_SLOG=ON
            -DENABLE_JOURNALD=OFF
            -DENABLE_JAVA=OFF
            -DENABLE_JAVA_MODULES=OFF
            -DENABLE_MONGODB=OFF
          "
          PKGCONF_PATH=$(pkgconf --variable pc_path pkgconf)
          export PKG_CONFIG_PATH="${PKGCONF_PATH}:$PKG_CONFIG_PATH"
          PATH="${BSDPORTS_PREFIX}/bin:${BSDPORTS_PREFIX}/sbin:${PATH}"

          gh_export BSDPORTS_PREFIX SYSLOG_NG_INSTALL_DIR CC CXX PKGCONF_PATH PKG_CONFIG_PATH THREADS CFLAGS CXXFLAGS LDFLAGS CONFIGURE_FLAGS CMAKE_CONFIGURE_FLAGS PATH
          gh_path "${PATH}"

          env | sort
          #cat "${GITHUB_ENV}" | sort

      - name: Setup the environment
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true

          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          cpu: ${{ env.THREADS }}

          sync: rsync # or sshfs or nfs
          copyback: false

          envs: |
            BSDPORTS_PREFIX SYSLOG_NG_INSTALL_DIR CC CXX PKGCONF_PATH PKG_CONFIG_PATH THREADS CFLAGS CXXFLAGS LDFLAGS CONFIGURE_FLAGS CMAKE_CONFIGURE_FLAGS PATH

          prepare: |
            #cat /etc/pkg/FreeBSD.conf

            # Make any implicit pkg bootstrap (on fresh VMs where pkg is not yet
            # installed) non-interactive.
            export ASSUME_ALWAYS_YES=yes

            # Workaround: the FreeBSD-ports "latest" catalogue is occasionally
            # served in a corrupted state (seen mostly on the 15.0 VM image),
            # which makes pkg fail with errors like:
            #   "pkg: truncated reply for signature_fingerprints"
            #   "Repository FreeBSD-ports cannot be opened. 'pkg update' required"
            # and every subsequent `pkg install` cannot find any package.
            # The "quarterly" branch is rebuilt less often and is unaffected,
            # so when we detect the breakage we point FreeBSD-ports at quarterly
            # for the rest of this job. Healthy runs keep the default repo.
            if pkg update -f 2>&1 | tee /tmp/pkg-update.log | grep -q "truncated reply\|cannot be opened"; then
              echo "Broken FreeBSD-ports catalogue detected; switching to the quarterly branch..."
              mkdir -p /usr/local/etc/pkg/repos
              cat > /usr/local/etc/pkg/repos/FreeBSD.conf <<'EOF'
            FreeBSD: {
              url: "pkg+http://pkg.FreeBSD.org/${ABI}/quarterly",
              mirror_type: "srv",
              signature_type: "fingerprints",
              fingerprints: "/usr/share/keys/pkg",
              enabled: yes
            }
            EOF
              pkg update -f
            else
              echo "pkg catalogue OK; using default repo configuration."
            fi

            pkg install -y autoconf autoconf-archive automake bison cmake flex git gperf glib json-c libtool pcre2 pkgconf gradle grpc hiredis libdbi libdbi-drivers libmaxminddb libnet libpaho-mqtt3 librdkafka libesmtp net-snmp openjdk25 rabbitmq-c riemann-c-client
            # For testing
            pkg install -y criterion libxml2 qpdf
            if  [ "${{ matrix.build-tool }}" = "autotools" ]; then
              # NOTE: Must have for autotools builds, but breaks cmake builds, nice :S
              pkg install -y gmake
            fi

          run: |
            env | sort

            # For checking the FreeBSD port source branch
            #cat /etc/pkg/FreeBSD.conf || true
            # As using the default actions/checkout@v4 to get the source code, the submodules are not checked out by default
            # Calling the git submodule update --init --recursive during the configure step would fail bacuse of the different git owners
            # So, the safe exceptions are added to the git config (other option could be a full manual source checkout that requires a bit
            # bigger effort, as the correct branch must be maintained as well)

            git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: cmake build
        if: matrix.build-tool == 'cmake'
        shell: freebsd {0}
        run: |
          set -e
          cd $GITHUB_WORKSPACE; pwd

          env | sort
          echo "ARCH: " $(uname -m)
          echo "clang:" $(which clang; clang --version)

          cmake --install-prefix "${SYSLOG_NG_INSTALL_DIR}" -B build . ${CMAKE_CONFIGURE_FLAGS}
          cmake --build ./build -j ${THREADS}  --target install

          echo ""
          echo "Checking produced installation..."
          "${SYSLOG_NG_INSTALL_DIR}/sbin/syslog-ng" -FdevtV > syslog-ng.unsorted.log 2>&1
          sort syslog-ng.unsorted.log > syslog-ng.log

          cat syslog-ng.log
          # Check for failing modules
          if grep -q "Error opening plugin module;" syslog-ng.log; then
            echo "Modules failing to load:"
            grep "Error opening plugin module;" syslog-ng.log
            exit 1
          fi

          MALLOC_CONF=stats_print:true "${SYSLOG_NG_INSTALL_DIR}/sbin/syslog-ng" -V 2>&1 | grep -A50 "jemalloc"

      - name: cmake check
        if: matrix.build-tool == 'cmake'
        shell: freebsd {0}
        run: |
          cd $GITHUB_WORKSPACE; pwd

          # Run the bundled ivykis self-tests too. syslog-ng's own
          # `check` target does not recurse into the ivykis
          # ExternalProject
          make -C build/ivykis-install/src/IVYKIS-build check -j ${THREADS}

          cmake --build ./build -j ${THREADS} --target check

      - name: autotools build
        if: matrix.build-tool == 'autotools'
        # Must use this custom shell, otherwise the evironment set up by the package installations above
        # will not be inherited
        # TODO: Also, for some reason splitting certain job steps has a similar issue, it cannot always work form the result of the previos step
        #       Using a single step now for building
        shell: freebsd {0}
        run: |
          set -e
          cd $GITHUB_WORKSPACE; pwd

          env | sort
          echo "ARCH: " $(uname -m)
          echo "clang:" $(which clang; clang --version)

          ./autogen.sh
          mkdir build
          cd build
          ../configure ${CONFIGURE_FLAGS}
          cd ..
          /usr/local/bin/gmake -C build install -j ${THREADS}

          echo ""
          echo "Checking produced installation..."
          "${SYSLOG_NG_INSTALL_DIR}/sbin/syslog-ng" -FdevtV > syslog-ng.unsorted.log 2>&1
          sort syslog-ng.unsorted.log > syslog-ng.log

          cat syslog-ng.log
          # Check for failing modules
          if grep -q "Error opening plugin module;" syslog-ng.log; then
            echo "Modules failing to load:"
            grep "Error opening plugin module;" syslog-ng.log
            exit 1
          fi

          MALLOC_CONF=stats_print:true "${SYSLOG_NG_INSTALL_DIR}/sbin/syslog-ng" -V 2>&1 | grep -A50 "jemalloc"

      - name: autotools check
        if: matrix.build-tool == 'autotools'
        shell: freebsd {0}
        run: |
          cd $GITHUB_WORKSPACE; pwd

          # Run the bundled ivykis self-tests too. syslog-ng's own
          # `make check` does not recurse into lib/ivykis (it is in
          # DIST_SUBDIRS, not SUBDIRS)
          /usr/local/bin/gmake -C build/lib/ivykis check -j ${THREADS}

          /usr/local/bin/gmake -C build check -j ${THREADS}
